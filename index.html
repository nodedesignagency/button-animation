  /* ---------------------------------------------------------------
     Design source: Figma frame 1244x335, inner frame 1200x327.
     1em on .fire-btn = 100 design px, so every measurement below is
     the Figma value / 100. One font-size scales the whole thing.
  --------------------------------------------------------------- */
  :root {
    --ring-top: #d84c38;     /* outer frame gradient, 0%   */
    --ring-bottom: #e7983b;  /* outer frame gradient, 100% */
    --face: #371f0f;         /* inner frame                */
    --heat: 0;               /* 0 at rest, 1 on hover      */
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: #ffffff;
    font-family: 'Silkscreen', 'Courier New', ui-monospace, monospace;
    overflow: hidden;
  }

  /* ---------------------------------------------------------------
     Button
  --------------------------------------------------------------- */
  .fire-btn {
    position: relative;
    appearance: none;
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    font: inherit;
    /* 1em = 100 design px; the 44px headroom keeps the overhanging
       fires (.62em each side) inside the viewport on small screens. */
    font-size: min(calc(780px / 12.44), calc((100vw - 44px) / 12.44));
    transform: translateZ(0);
    transition: transform .28s cubic-bezier(.2, .9, .25, 1.2), filter .3s ease;
    filter:
      drop-shadow(0 .12em .3em rgba(140, 60, 20, calc(.16 + .14 * var(--heat))))
      drop-shadow(0 0 calc(.2em + .35em * var(--heat)) rgba(255, 120, 35, calc(.18 + .38 * var(--heat))));
  }

  .fire-btn:hover,
  .fire-btn:focus-visible { --heat: 1; transform: translateY(-.05em) scale(1.015); }

  .fire-btn:focus-visible { outline: 2px dashed var(--ring-bottom); outline-offset: 12px; }

  .fire-btn:active { transform: translateY(.02em) scale(.99); transition-duration: .08s; }

  /* Outer frame 1244x335, ring = (1244-1200)/2 x (335-327)/2 = 22 x 4.
     The gradient paints the border-box, the face paints the padding-box. */
  .face {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .3em;
    width: 12.44em;
    height: 3.35em;
    border: solid transparent;
    border-width: .04em .22em;
    border-radius: .84em;
    background:
      linear-gradient(var(--face), var(--face)) padding-box,
      linear-gradient(180deg, var(--ring-top) 0%, var(--ring-bottom) 100%) border-box;
    overflow: hidden;
    isolation: isolate;
  }

  /* Heat sheen that sweeps the face on hover. */
  .face::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 200, 120, .13) 50%, transparent 65%);
    transform: translateX(-120%);
    pointer-events: none;
  }
  .fire-btn:hover .face::after,
  .fire-btn:focus-visible .face::after { animation: sheen 1.1s cubic-bezier(.3, 0, .2, 1); }

  @keyframes sheen { to { transform: translateX(120%); } }

  .label {
    font-size: .58em;
    line-height: 1;
    letter-spacing: .04em;
    color: #fff;
    white-space: nowrap;
    text-shadow: 0 0 calc(.1em + .3em * var(--heat)) rgba(255, 175, 80, calc(.25 + .5 * var(--heat)));
    transition: text-shadow .35s ease;
  }

  .arrow {
    width: .72em;
    height: .4em;
    flex: none;
    color: #fff;
    transition: transform .35s cubic-bezier(.2, .9, .25, 1.4);
  }
  .fire-btn:hover .arrow,
  .fire-btn:focus-visible .arrow { transform: translateX(.16em); }

  /* ---------------------------------------------------------------
     Fires — 243x243, sitting on the bottom corners IN FRONT of the
     button, spilling a little outward and below like the reference.
  --------------------------------------------------------------- */
  .fire {
    position: absolute;
    bottom: -.42em;
    width: 2.43em;
    height: 2.43em;
    pointer-events: none;
    transform-origin: 50% 92%;
    transition: transform .4s cubic-bezier(.2, .9, .25, 1.2);
    filter: drop-shadow(0 0 .22em rgba(255, 120, 30, calc(.4 + .3 * var(--heat))));
    z-index: 2;
  }
  .fire-left  { left: -.62em; }
  .fire-right { right: -.62em; transform: scaleX(-1); }

  .fire-btn:hover .fire-left,
  .fire-btn:focus-visible .fire-left { transform: scale(1.06); }
  .fire-btn:hover .fire-right,
  .fire-btn:focus-visible .fire-right { transform: scaleX(-1) scale(1.06); }

  /* Bonfire motion: the two flame layers sway and breathe on slow, offset
     clocks. Small amplitudes and long ease-in-out cycles — no bounce. */
  .fire g { transform-origin: 50% 96%; }

  .flame-outer { animation: sway-outer 4.8s ease-in-out infinite; }
  .flame-inner { animation: sway-inner 3.4s ease-in-out infinite; }

  /* Right fire runs on its own timing so the two sides never sync up. */
  .fire-right .flame-outer { animation-duration: 5.6s; animation-delay: -2.3s; }
  .fire-right .flame-inner { animation-duration: 3.9s; animation-delay: -1.4s; }

  @keyframes sway-outer {
    0%, 100% { transform: rotate(-1deg)  scale(1, 1); }
    28%      { transform: rotate(.7deg)  scale(1.005, 1.02); }
    52%      { transform: rotate(-.3deg) scale(1, 1.035); }
    76%      { transform: rotate(.9deg)  scale(1.005, 1.012); }
  }
  @keyframes sway-inner {
    0%, 100% { transform: rotate(1.1deg) scale(1, 1)      translateY(0); }
    30%      { transform: rotate(-.9deg) scale(.99, 1.045) translateY(-10px); }
    62%      { transform: rotate(.5deg)  scale(1.01, 1.015) translateY(4px); }
  }

  /* ---------------------------------------------------------------
     Embers rising from the two fires
  --------------------------------------------------------------- */
  .embers {
    position: absolute;
    inset: -.9em -.62em 0;
    pointer-events: none;
    z-index: 1;
  }

  .ember {
    position: absolute;
    bottom: 10%;
    left: var(--x);
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    background: radial-gradient(circle, #fff2b8, #ffb02e 45%, rgba(255, 90, 20, 0) 72%);
    opacity: 0;
    animation: rise var(--dur) linear var(--delay) infinite;
    will-change: transform, opacity;
  }

  @keyframes rise {
    0%   { opacity: 0;   transform: translate(0, 0) scale(.5); }
    12%  { opacity: 1; }
    70%  { opacity: .7; }
    100% { opacity: 0;   transform: translate(var(--drift), -3.4em) scale(.15); }
  }

  /* At rest only a few embers escape; hover releases the rest. */
  .ember:nth-child(n + 6) { opacity: 0; animation-play-state: paused; }
  .fire-btn:hover .ember:nth-child(n + 6),
  .fire-btn:focus-visible .ember:nth-child(n + 6) { animation-play-state: running; }

  /* ---------------------------------------------------------------
     Click burst
  --------------------------------------------------------------- */
  .fire-btn.burst .fire { animation: flare .5s cubic-bezier(.2, .9, .25, 1.3); }
  .fire-btn.burst .face { animation: scorch .5s ease-out; }

  @keyframes flare {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
  .fire-btn.burst .fire-right { animation-name: flare-mirrored; }
  @keyframes flare-mirrored {
    0%   { transform: scaleX(-1) scale(1); }
    40%  { transform: scaleX(-1) scale(1.14); }
    100% { transform: scaleX(-1) scale(1); }
  }
  @keyframes scorch {
    0%   { filter: brightness(1); }
    30%  { filter: brightness(1.35) saturate(1.2); }
    100% { filter: brightness(1); }
  }

  /* ---------------------------------------------------------------
     Reduced motion — keep the look, drop the loops
  --------------------------------------------------------------- */
  @media (prefers-reduced-motion: reduce) {
    .fire-btn, .fire g, .ember, .face::after { animation: none !important; }
    .ember { opacity: .7; }
  }
</style>
</head>
<body>

<button class="fire-btn" type="button" aria-label="Get in touch">

  <span class="face">
    <span class="label">GET IN TOUCH</span>
    <svg class="arrow" viewBox="0 0 46 26" fill="none" aria-hidden="true">
      <path d="M2 13h40M31 3l11 10-11 10" stroke="currentColor" stroke-width="3.4"
            stroke-linecap="square" stroke-linejoin="miter" />
    </svg>
  </span>

  <span class="embers" aria-hidden="true"></span>

  <!-- Left fire (emoji-traced: outer #FB4038->#FFA10E, inner #FFEF76->#FFB026) -->
  <svg class="fire fire-left" viewBox="0 0 1000 1000" aria-hidden="true">
    <defs>
      <linearGradient id="fOuter" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FB4038" />
        <stop offset="100%" stop-color="#FFA10E" />
      </linearGradient>
      <linearGradient id="fInner" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFEF76" />
        <stop offset="85%" stop-color="#FFB026" />
      </linearGradient>
      <radialGradient id="fGlow" cx="50%" cy="84%" r="42%">
        <stop offset="0%" stop-color="#FFF9E0" />
        <stop offset="55%" stop-color="#FFF3C4" stop-opacity=".75" />
        <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0" />
      </radialGradient>
    </defs>

    <g class="flame-outer">
      <path fill="url(#fOuter)" d="M500 973C310 973 105 856 105 645 105 520 168 468 206 406 230 366 246 320 252 282 285 350 305 415 315 468 335 400 385 235 410 120 416 85 424 45 432 12 505 90 578 170 628 268 662 330 674 400 652 462 700 455 775 440 834 441 872 492 893 570 893 652 893 856 690 973 500 973Z" />
    </g>
    <g class="flame-inner">
      <path fill="url(#fInner)" d="M505 950C395 950 295 865 295 745 295 692 312 660 334 630 324 610 326 592 340 576 352 548 372 515 400 482 450 428 535 390 570 348 588 425 625 495 660 575 698 662 704 758 662 838 625 905 572 950 505 950Z" />
      <path fill="url(#fGlow)" d="M505 950C395 950 295 865 295 745 295 692 312 660 334 630 324 610 326 592 340 576 352 548 372 515 400 482 450 428 535 390 570 348 588 425 625 495 660 575 698 662 704 758 662 838 625 905 572 950 505 950Z" />
    </g>
  </svg>

  <!-- Right fire (mirrored via CSS) -->
  <svg class="fire fire-right" viewBox="0 0 1000 1000" aria-hidden="true">
    <g class="flame-outer">
      <path fill="url(#fOuter)" d="M500 973C310 973 105 856 105 645 105 520 168 468 206 406 230 366 246 320 252 282 285 350 305 415 315 468 335 400 385 235 410 120 416 85 424 45 432 12 505 90 578 170 628 268 662 330 674 400 652 462 700 455 775 440 834 441 872 492 893 570 893 652 893 856 690 973 500 973Z" />
    </g>
    <g class="flame-inner">
      <path fill="url(#fInner)" d="M505 950C395 950 295 865 295 745 295 692 312 660 334 630 324 610 326 592 340 576 352 548 372 515 400 482 450 428 535 390 570 348 588 425 625 495 660 575 698 662 704 758 662 838 625 905 572 950 505 950Z" />
      <path fill="url(#fGlow)" d="M505 950C395 950 295 865 295 745 295 692 312 660 334 630 324 610 326 592 340 576 352 548 372 515 400 482 450 428 535 390 570 348 588 425 625 495 660 575 698 662 704 758 662 838 625 905 572 950 505 950Z" />
    </g>
  </svg>

</button>

<script>
  const btn = document.querySelector('.fire-btn');
  const embers = btn.querySelector('.embers');

  // Embers spawn from the two fire columns at the button's ends.
  const COLUMNS = [[1, 12], [88, 99]];

  for (let i = 0; i < 18; i++) {
    const [min, max] = COLUMNS[i % 2];
    const e = document.createElement('span');
    e.className = 'ember';
    e.style.setProperty('--x', (min + Math.random() * (max - min)).toFixed(2) + '%');
    e.style.setProperty('--size', (3 + Math.random() * 6).toFixed(1) + 'px');
    e.style.setProperty('--dur', (2.4 + Math.random() * 2.4).toFixed(2) + 's');
    e.style.setProperty('--delay', (-Math.random() * 3).toFixed(2) + 's');
    e.style.setProperty('--drift', (Math.random() * 40 - 20).toFixed(1) + 'px');
    embers.appendChild(e);
  }

  // One-shot flare on click.
  btn.addEventListener('click', () => {
    btn.classList.remove('burst');
    void btn.offsetWidth; // restart the animation
    btn.classList.add('burst');
  });
  btn.addEventListener('animationend', (ev) => {
    if (ev.animationName === 'scorch') btn.classList.remove('burst');
  });
</script>

</body>
</html>
