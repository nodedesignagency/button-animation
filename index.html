  /* ---------------------------------------------------------------
     Design source: Figma frame 1244x335, inner frame 1200x327.
     1em on .fire-btn = 100 design px, so every measurement below is
     the Figma value / 100. One font-size scales the whole thing.
  --------------------------------------------------------------- */
  :root {
    --ring-top: #d84c38;     /* outer frame gradient, 0%   */
    --ring-bottom: #e7983b;  /* outer frame gradient, 100% */
    --face: #371f0f;         /* inner frame                */
    --page: #f5f5f5;         /* page behind the button     */
    --heat: 0;               /* 0 at rest, 1 on hover      */
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--page);
    font-family: 'Silkscreen', 'Courier New', ui-monospace, monospace;
    overflow: hidden;
  }

  /* ---------------------------------------------------------------
     Button
  --------------------------------------------------------------- */
  .fire-btn {
    position: relative;
    appearance: none;
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    font: inherit;
    /* 1em = 100 design px. Desktop caps the frame at 780px; on narrow
       screens the divisor is the full footprint — the 12.44em frame plus
       the ~1.45em each side reached by the fires and, on click, the spill. */
    font-size: min(calc(780px / 12.44), calc((100vw - 16px) / 15.34));
    transform: translateZ(0);
    /* back-out curve: the release overshoots and settles instead of gliding */
    transition: transform .42s cubic-bezier(.34, 1.56, .64, 1), filter .3s ease;
    filter:
      drop-shadow(0 .12em .3em rgba(140, 60, 20, calc(.16 + .14 * var(--heat))))
      drop-shadow(0 0 calc(.2em + .35em * var(--heat)) rgba(255, 120, 35, calc(.18 + .38 * var(--heat))));
  }

  .fire-btn:hover,
  .fire-btn:focus-visible { --heat: 1; transform: translateY(-.05em) scale(1.015); }

  .fire-btn:focus-visible { outline: 2px dashed var(--ring-bottom); outline-offset: 12px; }

  /* Press physics. Driven by a class rather than :active so the spring-back
     outlives the pointerup — that release is where the tactility lives. */
  .fire-btn.pressing {
    transform: translateY(.045em) scale(.972);
    transition-duration: .09s;
    transition-timing-function: cubic-bezier(.4, 0, 1, 1);
  }

  /* Outer frame 1244x335, ring = (1244-1200)/2 x (335-327)/2 = 22 x 4.
     The gradient paints the border-box, the face paints the padding-box. */
  .face {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .3em;
    width: 12.44em;
    height: 3.35em;
    border: solid transparent;
    border-width: .04em .22em;
    border-radius: .84em;
    background:
      linear-gradient(var(--face), var(--face)) padding-box,
      linear-gradient(180deg, var(--ring-top) 0%, var(--ring-bottom) 100%) border-box;
    overflow: hidden;
    isolation: isolate;
    /* neutral shadow underneath: the warm filter glow reads as emitted light,
       this reads as weight. It tightens as the button is pressed down. */
    box-shadow:
      0 .10em .22em rgba(70, 35, 12, .16),
      0 .02em .05em rgba(70, 35, 12, .10);
    transition: box-shadow .42s cubic-bezier(.34, 1.56, .64, 1);
  }

  .fire-btn:hover .face,
  .fire-btn:focus-visible .face {
    box-shadow:
      0 .20em .42em rgba(70, 35, 12, .20),
      0 .04em .10em rgba(70, 35, 12, .12);
  }

  .fire-btn.pressing .face {
    box-shadow: 0 .03em .08em rgba(70, 35, 12, .24);
    transition-duration: .09s;
  }

  /* Heat sheen that sweeps the face on hover. */
  .face::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 200, 120, .13) 50%, transparent 65%);
    transform: translateX(-120%);
    pointer-events: none;
  }
  .fire-btn:hover .face::after,
  .fire-btn:focus-visible .face::after { animation: sheen 1.1s cubic-bezier(.3, 0, .2, 1); }

  @keyframes sheen { to { transform: translateX(120%); } }

  .label {
    font-size: .78em;
    line-height: 1;
    letter-spacing: .04em;
    color: #fff;
    white-space: nowrap;
    text-shadow: 0 0 calc(.1em + .3em * var(--heat)) rgba(255, 175, 80, calc(.25 + .5 * var(--heat)));
    transition: text-shadow .35s ease;
  }

  .arrow {
    width: .78em;
    height: .44em;
    flex: none;
    color: #fff;
    transition: transform .35s cubic-bezier(.2, .9, .25, 1.4);
  }
  .fire-btn:hover .arrow,
  .fire-btn:focus-visible .arrow { transform: translateX(.16em); }

  /* Shoots off to the right and returns from the left. */
  .fire-btn.launch .arrow { animation: arrow-launch .52s cubic-bezier(.3, 0, .2, 1); }

  @keyframes arrow-launch {
    0%   { transform: translateX(0);      opacity: 1; }
    24%  { transform: translateX(.9em);   opacity: 0; }
    25%  { transform: translateX(-.55em); opacity: 0; }
    55%  { opacity: 1; }
    100% { transform: translateX(0);      opacity: 1; }
  }

  /* ---------------------------------------------------------------
     Fires — 243x243, sitting on the bottom corners IN FRONT of the
     button, spilling a little outward and below like the reference.
  --------------------------------------------------------------- */
  .fire {
    position: absolute;
    bottom: -.08em;   /* flame foot sits on the button edge; box has slack below */
    width: 2.6em;
    height: 2.6em;
    pointer-events: none;
    transform-origin: 50% 92%;
    transition: transform .4s cubic-bezier(.2, .9, .25, 1.2);
    filter: drop-shadow(0 0 .22em rgba(255, 120, 30, calc(.4 + .3 * var(--heat))));
    z-index: 2;
  }
  .fire-left  { left: -.95em; }
  .fire-right { right: -.95em; transform: scaleX(-1); }

  .fire-btn:hover .fire-left,
  .fire-btn:focus-visible .fire-left { transform: scale(1.06); }
  .fire-btn:hover .fire-right,
  .fire-btn:focus-visible .fire-right { transform: scaleX(-1) scale(1.06); }

  /* Flame motion is SMIL path morphing inside the SVGs: a slow wave travels
     up each silhouette (base anchored), like the animated fire emoji. The
     right fire's animations run on offset clocks so the sides never sync.
     Reduced-motion pausing is handled in the script below. */

  /* ---------------------------------------------------------------
     Embers rising from the two fires
  --------------------------------------------------------------- */
  .embers {
    position: absolute;
    inset: -.9em -.62em 0;
    pointer-events: none;
    z-index: 1;
  }

  .ember {
    position: absolute;
    bottom: 10%;
    left: var(--x);
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    background: radial-gradient(circle, #fff2b8, #ffb02e 45%, rgba(255, 90, 20, 0) 72%);
    opacity: 0;
    animation: rise var(--dur) linear var(--delay) infinite;
    will-change: transform, opacity;
  }

  @keyframes rise {
    0%   { opacity: 0;   transform: translate(0, 0) scale(.5); }
    12%  { opacity: 1; }
    70%  { opacity: .7; }
    100% { opacity: 0;   transform: translate(var(--drift), -3.4em) scale(.15); }
  }

  /* At rest only a few embers escape; hover releases the rest. */
  .ember:nth-child(n + 6) { opacity: 0; animation-play-state: paused; }
  .fire-btn:hover .ember:nth-child(n + 6),
  .fire-btn:focus-visible .ember:nth-child(n + 6) { animation-play-state: running; }

  /* ---------------------------------------------------------------
     Sparks — bits of fire thrown out and down when the button is hit
  --------------------------------------------------------------- */
  .sparks {
    position: absolute;
    bottom: .2em;
    width: 0;
    height: 0;
    pointer-events: none;
    z-index: 3;
  }
  .sparks-left  { left: .3em; }
  .sparks-right { right: .3em; }

  .shard {
    position: absolute;
    left: 0;
    bottom: 0;
    width: var(--sz);
    height: calc(var(--sz) * 1.4);
    margin-left: calc(var(--sz) / -2);
    opacity: 0;
    filter: drop-shadow(0 0 .09em rgba(255, 90, 20, .95));
    will-change: transform, opacity;
  }
  .fire-btn.burst .shard {
    animation: spill var(--dur) cubic-bezier(.2, .55, .35, 1) var(--delay) both;
  }

  /* Kicked up and outward first, then it falls away to the side. */
  @keyframes spill {
    0%   { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(.5); }
    26%  { opacity: 1; transform: translate(calc(var(--dx) * .5), calc(var(--rise) * -1)) rotate(calc(var(--rot) * .3)) scale(1); }
    70%  { opacity: 1; transform: translate(calc(var(--dx) * .85), calc(var(--drop) * .4)) rotate(calc(var(--rot) * .72)) scale(.85); }
    100% { opacity: 0; transform: translate(var(--dx), var(--drop)) rotate(var(--rot)) scale(.45); }
  }

  /* ---------------------------------------------------------------
     Click burst
  --------------------------------------------------------------- */
  .fire-btn.burst .fire { animation: flare .72s cubic-bezier(.16, .8, .3, 1); }
  .fire-btn.burst .face { animation: scorch .5s ease-out; }

  @keyframes flare {
    0%   { transform: scale(1); }
    22%  { transform: scale(1.22); }
    55%  { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  .fire-btn.burst .fire-right { animation-name: flare-mirrored; }
  @keyframes flare-mirrored {
    0%   { transform: scaleX(-1) scale(1); }
    22%  { transform: scaleX(-1) scale(1.22); }
    55%  { transform: scaleX(-1) scale(1.06); }
    100% { transform: scaleX(-1) scale(1); }
  }
  @keyframes scorch {
    0%   { filter: brightness(1); }
    30%  { filter: brightness(1.35) saturate(1.2); }
    100% { filter: brightness(1); }
  }

  /* ---------------------------------------------------------------
     Reduced motion — keep the look, drop the loops
  --------------------------------------------------------------- */
  @media (prefers-reduced-motion: reduce) {
    .fire-btn, .ember, .face::after, .shard, .arrow { animation: none !important; }
    .ember { opacity: .7; }
  }
</style>

    const [min, max] = COLUMNS[i % 2];
    const e = document.createElement('span');
    e.className = 'ember';
    e.style.setProperty('--x', (min + Math.random() * (max - min)).toFixed(2) + '%');
    e.style.setProperty('--size', (3 + Math.random() * 6).toFixed(1) + 'px');
    e.style.setProperty('--dur', (2.4 + Math.random() * 2.4).toFixed(2) + 's');
    e.style.setProperty('--delay', (-Math.random() * 3).toFixed(2) + 's');
    e.style.setProperty('--drift', (Math.random() * 40 - 20).toFixed(1) + 'px');
    embers.appendChild(e);
  }

  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  const fires = [...document.querySelectorAll('.fire')];

  // --- sparks -----------------------------------------------------------
  // Each side throws its bits outward: left goes left, right goes right.
  const SHARD = 'M12 0c6 8 12 14 12 21a12 12 0 0 1-24 0C0 14 6 8 12 0Z';

  // Each shard carries its own gradient. A shard is filtered (for the glow),
  // and a filter isolates the rendering context — a paint server borrowed
  // from the fire's <defs> would not resolve inside it.
  let shardId = 0;
  for (const box of document.querySelectorAll('.sparks')) {
    const dir = box.classList.contains('sparks-left') ? -1 : 1;
    for (let i = 0; i < 6; i++) {
      const id = 'sg' + shardId++;
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.setAttribute('class', 'shard');
      s.setAttribute('viewBox', '0 0 24 33');
      s.innerHTML =
        '<linearGradient id="' + id + '" x1="12" y1="0" x2="12" y2="33" gradientUnits="userSpaceOnUse">' +
        '<stop stop-color="#ffd15a"/><stop offset=".45" stop-color="#ff7d18"/>' +
        '<stop offset="1" stop-color="#ee4526"/></linearGradient>' +
        '<path d="' + SHARD + '" fill="url(#' + id + ')"/>';
      box.appendChild(s);
    }
    box.dataset.dir = dir;
  }

  // Re-roll each shard's trajectory so no two clicks throw the same shape.
  function rollSparks() {
    for (const box of document.querySelectorAll('.sparks')) {
      const dir = Number(box.dataset.dir);
      [...box.children].forEach((s, i) => {
        // em, so the spray scales with the button like everything else
        const spread = 0.4 + Math.random() * 0.9;     // how far out it lands
        s.style.setProperty('--sz', (0.34 + Math.random() * 0.28).toFixed(3) + 'em');
        // it has to clear the flame silhouette (~.9em) before it reads
        s.style.setProperty('--dx', (dir * (0.95 + spread * 0.8)).toFixed(3) + 'em');
        s.style.setProperty('--rise', (0.16 + Math.random() * 0.3).toFixed(3) + 'em');
        s.style.setProperty('--drop', (0.62 + Math.random() * 0.7).toFixed(3) + 'em');
        s.style.setProperty('--rot', (dir * (50 + Math.random() * 170)).toFixed(0) + 'deg');
        s.style.setProperty('--dur', (0.62 + Math.random() * 0.34).toFixed(2) + 's');
        s.style.setProperty('--delay', (i * 0.022 + Math.random() * 0.06).toFixed(3) + 's');
      });
    }
  }
  rollSparks();

  // --- fierce burn ------------------------------------------------------
  // SMIL has no playback-rate control, so drive the timeline by hand for a
  // moment: pause the clock, advance it fast with an ease-out, then hand it
  // back. The flames lick harder without the loop ever jumping.
  function burnFierce(svg, ms = 780, rate = 3.1) {
    const t0 = svg.getCurrentTime();
    const started = performance.now();
    svg.pauseAnimations();
    const step = (now) => {
      const p = Math.min(1, (now - started) / ms);
      const eased = p * (2 - p);                      // fast first, settling
      svg.setCurrentTime(t0 + (ms / 1000) * rate * eased);
      if (p < 1) requestAnimationFrame(step);
      else svg.unpauseAnimations();
    };
    requestAnimationFrame(step);
  }

  // --- press physics -----------------------------------------------------
  // Driven by a class rather than :active so the spring-back outlives the
  // pointerup. pointercancel and leaving while held both release, so the
  // button can never stick down.
  const press = () => btn.classList.add('pressing');
  const release = () => btn.classList.remove('pressing');
  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('pointerleave', release);
  // keyboard activation gets the same press, so Space/Enter feels like a click
  btn.addEventListener('keydown', (e) => {
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) press();
  });
  btn.addEventListener('keyup', (e) => {
    if (e.key === ' ' || e.key === 'Enter') release();
  });
  btn.addEventListener('blur', release);

  // The spill outlasts the flare and the scorch flash, so the class is held
  // for the longest of them — dropping it on the first animationend would
  // cut the shards off mid-flight.
  const BURST_MS = 1300;
  let burstTimer, launchTimer;
  btn.addEventListener('click', () => {
    btn.classList.remove('burst');
    void btn.offsetWidth; // restart the animation
    rollSparks();
    btn.classList.add('burst');
    if (!calm.matches) fires.forEach((f) => burnFierce(f));
    clearTimeout(burstTimer);
    burstTimer = setTimeout(() => btn.classList.remove('burst'), BURST_MS);

    // the arrow launches on release — our equivalent of the star popping
    btn.classList.remove('launch');
    void btn.offsetWidth;
    btn.classList.add('launch');
    clearTimeout(launchTimer);
    launchTimer = setTimeout(() => btn.classList.remove('launch'), 540);
  });

  // The flame morph is SMIL, which CSS media queries can't reach.
  const applyCalm = () => { if (calm.matches) fires.forEach((f) => f.pauseAnimations()); };
  applyCalm();
  calm.addEventListener('change', () => calm.matches ? applyCalm() : fires.forEach((f) => f.unpauseAnimations()));
</script>

</body>
</html>
