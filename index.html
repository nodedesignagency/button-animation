  /* ---------------------------------------------------------------
     Tokens
  --------------------------------------------------------------- */
  :root {
    --bg: #f2f2f2;

    --btn-top: #4d2415;
    --btn-bottom: #2a1007;

    --ember-red: #e8412a;
    --ember-orange: #ff7a18;
    --ember-amber: #ffb02e;
    --ember-gold: #ffd76a;
    --ember-core: #fff2b8;

    --radius: 24px;
    --ring: 4px;

    /* Heat level: 0 at rest, 1 on hover. Drives every flare-up at once. */
    --heat: 0;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    /* Faint warm bloom on the page so the button feels like it emits light. */
    background-image: radial-gradient(60% 40% at 50% 50%, rgba(255, 138, 40, 0.10), transparent 70%);
    font-family: 'Silkscreen', 'Courier New', ui-monospace, monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------------------------------------------------------
     Stage
  --------------------------------------------------------------- */
  .stage {
    position: relative;
    display: grid;
    place-items: center;
    padding: 16vh 24px;
  }

  /* Warm light the button casts on the white page. */
  .stage::before {
    content: '';
    position: absolute;
    inset: 12% 4%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(255, 120, 30, 0.28), transparent 68%);
    filter: blur(30px);
    opacity: calc(0.35 + 0.5 * var(--heat));
    transform: scale(calc(1 + 0.12 * var(--heat)));
    transition: opacity .45s ease, transform .45s ease;
    pointer-events: none;
  }

  /* ---------------------------------------------------------------
     Button
  --------------------------------------------------------------- */
  .fire-btn {
    position: relative;
    appearance: none;
    border: 0;
    padding: 0;
    border-radius: var(--radius);
    cursor: pointer;
    background: none;
    font: inherit; /* buttons do not inherit the page font on their own */
    /* Everything below is sized in em off this one value, so the whole
       button — padding, flames, arrow, glow — scales as a single unit. */
    font-size: clamp(15px, 3.6vw, 40px);
    --radius: .6em;
    --ring: max(3px, .1em);
    transform: translateZ(0);
    transition: transform .28s cubic-bezier(.2, .9, .25, 1.2), filter .3s ease;
    filter:
      drop-shadow(0 6px 14px rgba(120, 40, 10, calc(0.18 + 0.22 * var(--heat))))
      drop-shadow(0 0 calc(14px + 26px * var(--heat)) rgba(255, 110, 30, calc(0.25 + 0.45 * var(--heat))));
  }

  .fire-btn:hover,
  .fire-btn:focus-visible {
    --heat: 1;
    transform: translateY(-3px) scale(1.02);
  }
  .fire-btn:hover .face,
  .fire-btn:focus-visible .face { animation-duration: 2.4s; }

  .fire-btn:focus-visible { outline: 2px dashed rgba(255, 180, 60, .9); outline-offset: 10px; }

  .fire-btn:active {
    transform: translateY(1px) scale(.985);
    transition-duration: .08s;
  }

  /* The gradient ring is painted as the face's border so it stays in front of
     the flames, which sit on a negative z-index behind it. */
  @keyframes ring-drift {
    0%, 100% { background-position: 0 0, 0 0, 0% 50%; }
    50%      { background-position: 0 0, 0 0, 100% 50%; }
  }

  /* Dark inner face */
  .face {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .65em;
    padding: .85em 2.4em;
    border: var(--ring) solid transparent;
    border-radius: var(--radius);
    background:
      radial-gradient(120% 160% at 50% -30%, rgba(255, 140, 50, .22), transparent 60%) padding-box,
      linear-gradient(180deg, var(--btn-top), var(--btn-bottom)) padding-box,
      linear-gradient(158deg,
        var(--ember-red) 0%,
        #ff5b25 26%,
        var(--ember-orange) 50%,
        var(--ember-amber) 76%,
        #ffcb4d 100%) border-box;
    background-size: auto, auto, 220% 220%;
    animation: ring-drift 6s ease-in-out infinite;
    box-shadow:
      inset 0 1px 0 rgba(255, 190, 120, .28),
      inset 0 -14px 26px rgba(0, 0, 0, .38);
    overflow: hidden;
    isolation: isolate;
  }

  /* Heat sheen that sweeps across the face on hover. */
  .face::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 200, 120, .16) 50%, transparent 65%);
    transform: translateX(-120%);
    pointer-events: none;
  }
  .fire-btn:hover .face::after,
  .fire-btn:focus-visible .face::after { animation: sheen 1.1s cubic-bezier(.3, 0, .2, 1); }

  @keyframes sheen {
    to { transform: translateX(120%); }
  }

  .label {
    font-size: 1em;
    line-height: 1;
    letter-spacing: .07em;
    color: #fff;
    text-shadow: 0 0 calc(6px + 14px * var(--heat)) rgba(255, 170, 70, calc(.35 + .5 * var(--heat)));
    transition: text-shadow .35s ease;
    white-space: nowrap;
  }

  .arrow {
    width: 1.15em;
    height: .65em;
    flex: none;
    color: #fff;
    transition: transform .35s cubic-bezier(.2, .9, .25, 1.4);
  }
  .fire-btn:hover .arrow,
  .fire-btn:focus-visible .arrow { transform: translateX(10px); }

  /* ---------------------------------------------------------------
     Flames
  --------------------------------------------------------------- */
  .flame {
    position: absolute;
    bottom: -.15em;
    width: 3.95em;
    height: 5.2em;
    pointer-events: none;
    transform-origin: 50% 100%;
    transition: transform .4s cubic-bezier(.2, .9, .25, 1.2);
    /* Flame layers glow into each other. */
    filter: blur(.4px) drop-shadow(0 0 18px rgba(255, 110, 20, .55));
    z-index: -1;
  }
  .flame-left  { left: -1.45em; }
  .flame-right { right: -1.45em; transform: scaleX(-1); }

  /* Grow, but lean back into the button so the fire stays attached to it.
     The right flame is mirrored, so +x there also reads as "inward". */
  .fire-btn:hover .flame-left,
  .fire-btn:focus-visible .flame-left { transform: scale(1.14) translate(.175em, -.15em); }
  .fire-btn:hover .flame-right,
  .fire-btn:focus-visible .flame-right { transform: scaleX(-1) scale(1.14) translate(.175em, -.15em); }

  /* Each layer licks on its own clock so the fire never looks looped. */
  .flame path { transform-origin: 50% 100%; }

  .lick-outer { animation: lick-a 1.45s ease-in-out infinite; }
  .lick-mid   { animation: lick-b 1.05s ease-in-out infinite; }
  .lick-inner { animation: lick-c  .78s ease-in-out infinite; }
  .lick-core  { animation: lick-d  .62s ease-in-out infinite; }

  .fire-btn:hover .lick-outer, .fire-btn:focus-visible .lick-outer { animation-duration: .95s; }
  .fire-btn:hover .lick-mid,   .fire-btn:focus-visible .lick-mid   { animation-duration: .68s; }
  .fire-btn:hover .lick-inner, .fire-btn:focus-visible .lick-inner { animation-duration: .5s;  }
  .fire-btn:hover .lick-core,  .fire-btn:focus-visible .lick-core  { animation-duration: .4s;  }

  /* Right-hand flame runs offset so the two sides never sync up. */
  .flame-right .lick-outer { animation-delay: -.5s; }
  .flame-right .lick-mid   { animation-delay: -.33s; }
  .flame-right .lick-inner { animation-delay: -.21s; }
  .flame-right .lick-core  { animation-delay: -.17s; }

  @keyframes lick-a {
    0%, 100% { transform: scale(1, 1)       skewX(0deg)   translateY(0); }
    30%      { transform: scale(.94, 1.09)  skewX(-3.5deg) translateY(-5px); }
    60%      { transform: scale(1.05, .95)  skewX(3deg)   translateY(2px); }
  }
  @keyframes lick-b {
    0%, 100% { transform: scale(1, 1)      skewX(2deg)   translateY(0); }
    35%      { transform: scale(1.06, .92) skewX(-4deg)  translateY(3px); }
    70%      { transform: scale(.92, 1.12) skewX(4.5deg) translateY(-6px); }
  }
  @keyframes lick-c {
    0%, 100% { transform: scale(1, 1)       skewX(-2deg) translateY(0);    opacity: .95; }
    40%      { transform: scale(.9, 1.14)   skewX(4deg)  translateY(-8px); opacity: 1; }
    75%      { transform: scale(1.08, .9)   skewX(-3deg) translateY(3px);  opacity: .88; }
  }
  @keyframes lick-d {
    0%, 100% { transform: scale(1, 1)      translateY(0);    opacity: .9; }
    45%      { transform: scale(.86, 1.18) translateY(-7px); opacity: 1; }
  }

  /* ---------------------------------------------------------------
     Embers
  --------------------------------------------------------------- */
  .embers {
    position: absolute;
    inset: -1em -1.45em 0;
    pointer-events: none;
    z-index: -1;
    overflow: visible;
  }

  .ember {
    position: absolute;
    bottom: 22%;
    left: var(--x);
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    background: radial-gradient(circle, var(--ember-core), var(--ember-amber) 45%, rgba(255, 90, 20, 0) 72%);
    opacity: 0;
    animation: rise var(--dur) linear var(--delay) infinite;
    will-change: transform, opacity;
  }

  @keyframes rise {
    0%   { opacity: 0;   transform: translate(0, 0) scale(.5); }
    12%  { opacity: 1; }
    70%  { opacity: .75; }
    100% { opacity: 0;   transform: translate(var(--drift), -4.8em) scale(.15); }
  }

  /* At rest only a few embers escape; hover releases the rest. */
  .ember:nth-child(n + 6) { opacity: 0; animation-play-state: paused; }
  .fire-btn:hover .ember:nth-child(n + 6),
  .fire-btn:focus-visible .ember:nth-child(n + 6) { animation-play-state: running; }

  /* ---------------------------------------------------------------
     Click burst
  --------------------------------------------------------------- */
  .fire-btn.burst .flame { animation: flare .5s cubic-bezier(.2, .9, .25, 1.3); }
  .fire-btn.burst .face  { animation: scorch .5s ease-out; }

  @keyframes flare {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.42) translateY(-14px); }
    100% { transform: scale(1); }
  }
  /* The right flame is mirrored, so it needs its own flare. */
  .fire-btn.burst .flame-right { animation-name: flare-mirrored; }
  @keyframes flare-mirrored {
    0%   { transform: scaleX(-1) scale(1); }
    35%  { transform: scaleX(-1) scale(1.42) translateY(-14px); }
    100% { transform: scaleX(-1) scale(1); }
  }
  @keyframes scorch {
    0%   { filter: brightness(1); }
    25%  { filter: brightness(1.9) saturate(1.4); }
    100% { filter: brightness(1); }
  }

  /* Sizing is handled by the em scale above; only the very narrow case needs
     the flames pulled in so they do not run off the viewport. */
  @media (max-width: 400px) {
    .stage { padding: 16vh 14px; }
    .face  { padding: .85em 1.7em; }
  }

  /* ---------------------------------------------------------------
     Reduced motion — keep the look, drop the loops
  --------------------------------------------------------------- */
  @media (prefers-reduced-motion: reduce) {
    .fire-btn, .flame path, .ember, .face::after {
      animation: none !important;
    }
    .ember { opacity: .8; }
  }
</style>
</head>
<body>

<div class="stage">
  <button class="fire-btn" type="button" aria-label="Get in touch">

    <!-- Left flame -->
    <svg class="flame flame-left" viewBox="0 0 120 160" aria-hidden="true">
      <defs>
        <linearGradient id="gOuter" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%"   stop-color="#d8321d" />
          <stop offset="55%"  stop-color="#ff6a12" />
          <stop offset="100%" stop-color="#ff9c1f" />
        </linearGradient>
        <linearGradient id="gMid" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%"   stop-color="#ff6b16" />
          <stop offset="60%"  stop-color="#ffa524" />
          <stop offset="100%" stop-color="#ffc93f" />
        </linearGradient>
        <linearGradient id="gInner" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%"   stop-color="#ffb62c" />
          <stop offset="70%"  stop-color="#ffe07a" />
          <stop offset="100%" stop-color="#fff3bd" />
        </linearGradient>
      </defs>

      <path class="lick-outer" fill="url(#gOuter)"
            d="M60 158C24 158 8 132 8 104 8 78 24 66 30 46c5-17 2-30-6-46 22 10 36 26 42 44 6-11 8-22 5-34 21 18 33 40 35 62 2 20-4 34-12 44 10-2 16-9 19-19 5 15 4 32-6 45-11 15-27 22-47 22Z" />

      <path class="lick-mid" fill="url(#gMid)"
            d="M60 158c-24 0-38-17-38-38 0-19 11-30 17-44 5-12 6-24 2-36 16 9 27 23 31 38 4-8 5-16 3-24 14 14 22 31 22 48 0 12-3 22-9 30 7-2 11-7 13-14 3 11 2 23-5 31-8 9-20 9-36 9Z" />

      <path class="lick-inner" fill="url(#gInner)"
            d="M60 158c-15 0-24-11-24-25 0-13 8-21 12-31 4-9 4-18 1-27 13 8 21 19 24 31 3-6 3-12 2-18 10 11 15 23 15 35 0 20-13 35-30 35Z" />

      <path class="lick-core" fill="#fff6d8" opacity=".85"
            d="M60 158c-8 0-13-7-13-16 0-9 5-14 8-21 3-6 3-12 1-18 9 7 15 16 16 25 2-4 2-8 1-12 5 8 7 16 7 24 0 11-8 18-20 18Z" />
    </svg>

    <!-- Right flame (mirrored via CSS) -->
    <svg class="flame flame-right" viewBox="0 0 120 160" aria-hidden="true">
      <path class="lick-outer" fill="url(#gOuter)"
            d="M60 158C24 158 8 132 8 104 8 78 24 66 30 46c5-17 2-30-6-46 22 10 36 26 42 44 6-11 8-22 5-34 21 18 33 40 35 62 2 20-4 34-12 44 10-2 16-9 19-19 5 15 4 32-6 45-11 15-27 22-47 22Z" />
      <path class="lick-mid" fill="url(#gMid)"
            d="M60 158c-24 0-38-17-38-38 0-19 11-30 17-44 5-12 6-24 2-36 16 9 27 23 31 38 4-8 5-16 3-24 14 14 22 31 22 48 0 12-3 22-9 30 7-2 11-7 13-14 3 11 2 23-5 31-8 9-20 9-36 9Z" />
      <path class="lick-inner" fill="url(#gInner)"
            d="M60 158c-15 0-24-11-24-25 0-13 8-21 12-31 4-9 4-18 1-27 13 8 21 19 24 31 3-6 3-12 2-18 10 11 15 23 15 35 0 20-13 35-30 35Z" />
      <path class="lick-core" fill="#fff6d8" opacity=".85"
            d="M60 158c-8 0-13-7-13-16 0-9 5-14 8-21 3-6 3-12 1-18 9 7 15 16 16 25 2-4 2-8 1-12 5 8 7 16 7 24 0 11-8 18-20 18Z" />
    </svg>

    <!-- Rising embers -->
    <span class="embers" aria-hidden="true"></span>

    <!-- Face -->
    <span class="face">
      <span class="label">GET IN TOUCH</span>
      <svg class="arrow" viewBox="0 0 46 26" fill="none" aria-hidden="true">
        <path d="M2 13h40M31 3l11 10-11 10" stroke="currentColor" stroke-width="3.2"
              stroke-linecap="square" stroke-linejoin="miter" />
      </svg>
    </span>

  </button>
</div>

<script>
  const btn = document.querySelector('.fire-btn');
  const embers = btn.querySelector('.embers');

  // Embers spawn from the two flame columns, not from across the whole button.
  const COLUMNS = [
    [2, 16],   // left flame
    [84, 98],  // right flame
  ];

  for (let i = 0; i < 18; i++) {
    const [min, max] = COLUMNS[i % 2];
    const e = document.createElement('span');
    e.className = 'ember';
    e.style.setProperty('--x', (min + Math.random() * (max - min)).toFixed(2) + '%');
    e.style.setProperty('--size', (3 + Math.random() * 6).toFixed(1) + 'px');
    e.style.setProperty('--dur', (1.6 + Math.random() * 2.2).toFixed(2) + 's');
    e.style.setProperty('--delay', (-Math.random() * 3).toFixed(2) + 's');
    e.style.setProperty('--drift', (Math.random() * 44 - 22).toFixed(1) + 'px');
    embers.appendChild(e);
  }

  // One-shot flare on click.
  btn.addEventListener('click', () => {
    btn.classList.remove('burst');
    void btn.offsetWidth; // restart the animation
    btn.classList.add('burst');
  });
  btn.addEventListener('animationend', (ev) => {
    if (ev.animationName === 'scorch') btn.classList.remove('burst');
  });
</script>

</body>
</html>
